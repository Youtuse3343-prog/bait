{% extends "base.html" %}
{% block title %}Verification Result{% endblock %}
{% block content %}
<section class="center-card compact">
  <div class="result-icon {{ 'ok' if ok else 'bad' }}">{{ '✓' if ok else '!' }}</div>
  <h1>{{ 'Verified' if ok else 'Verification failed' }}</h1>
  <p>{{ message }}</p>
</section>
{% endblock %}
